# yaml-language-server: $schema=../schemas/mirror-v3.config.schema.json
#
# Two mirrors of distinct partitions, archived to the local filesystem
# with per-mirror flush triggers.
#
# !! Deployment requirement !!
# "Parallel" here means N mirrors run inside a SINGLE process. The
# deployment must still be single-replica — two pods writing to the
# same destination directory would race on filename renames and
# trip the scan-validate on the next restart. Deploy with:
#   spec.replicas: 1
#   spec.strategy.type: Recreate

# Per-mirror encoding. Each mirror writes under
# `<root>/<mirror.name>/<partition>/<from>-<to>.<ext>` (destination.name
# defaults to mirror.name for the single-destination case).
mirrors:
  - name: operations-p0
    source:
      bootstrap-servers: kafka-source:9092
    topic: operations-v1
    partition: 0
    destinations:
      - type: filesystem
        root: /var/lib/mirror-v3
    # format defaults to `parquet`; use `ndjson` for jq-friendly dumps.
    # format: parquet
    # compression defaults to `zstd-1`. Other options: zstd-3, snappy, lz4, uncompressed.
    # compression: zstd-1
    # `keys` and `values` declare the topic schema. Defaults to
    # `{ type: utf8 }`. On Parquet every variant lands as a `Utf8`
    # column; the variant decides what's inside the string, which
    # extension metadata is set, and what the encoder validates:
    #   - `utf8`           — UTF-8 string, no extension. Non-UTF-8
    #                        input is a hard error at encode.
    #   - `json`           — UTF-8 JSON, tagged `arrow.json` (consumer
    #                        hint; mirror-v3 enforces UTF-8 only).
    #   - `json-parseable` — same on-disk shape as `json`; the encoder
    #                        also runs `serde_json` and fails hard on
    #                        unparseable JSON.
    #   - `bytes`          — arbitrary bytes, base64-encoded, tagged
    #                        `mirror_v3.bytes_base64`. Use for raw
    #                        byte payloads that need to round-trip
    #                        through a text-only column.
    # keys:   { type: utf8 }
    # values: { type: json-parseable }
    flush:
      max-time-ms: 5000          # at most 5s of buffering
      max-bytes: 67108864        # or 64 MiB
      max-offsets: 10000         # or 10k source offsets
      # Optional: also force a flush at a fixed UTC time each day. If the
      # buffer is empty at the boundary, the slot is silently skipped.
      # daily:
      #   at-utc: "00:00:00"
  - name: operations-p1
    source:
      bootstrap-servers: kafka-source:9092
    topic: operations-v1
    partition: 1
    destinations:
      - type: filesystem
        root: /var/lib/mirror-v3
    flush:
      max-time-ms: 5000
      max-bytes: 67108864
      max-offsets: 10000
