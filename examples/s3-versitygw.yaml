# yaml-language-server: $schema=../schemas/mirror-v3.config.schema.json
#
# Two mirrors against the same VersityGW bucket: an append-mode event
# stream (`orders`, value column tagged as JSON) and a compacted table
# (`user-states`, latest value per key per snapshot).
#
# Each mirror writes under `<prefix>/<mirror.name>/<partition>/<file>`.
#
# !! Deployment requirement !!
# The destination MUST have exactly one writer per (topic, partition)
# at any moment. For VersityGW specifically, `If-None-Match: *` is a
# no-op (verified in e2e), so the atomicity backstop is the
# deployment guarantee plus scan-validate on startup. Deploy with:
#   spec.replicas: 1
#   spec.strategy.type: Recreate
# Anything else risks two writers producing overlapping blob ranges
# and tripping the corrupt-chain detector on the next restart.

destination:
  type: s3
  endpoint: http://versitygw.storage.svc.cluster.local:7070
  region: us-east-1
  bucket: mirror-v3
  prefix: archive/

mirrors:
  - name: orders
    source:
      bootstrap-servers: kafka-source:9092
    topic: orders
    partition: 0
    format: parquet
    compression: zstd-1
    # `values: { type: json }` writes `value` as a Utf8 column tagged
    # with the `arrow.json` canonical extension metadata. Operators
    # using DuckDB / Athena get a VARCHAR column with a JSON hint;
    # mirror-v3 itself does not parse the values beyond UTF-8.
    values: { type: json }
    flush:
      max-time-ms: 60000
      max-bytes: 67108864
      max-offsets: 10000
  - name: user-states
    source:
      bootstrap-servers: kafka-source:9092
    topic: user-states
    partition: 0
    format: parquet
    compression: zstd-1
    # Kafka-style log compaction. Each Parquet file is a full
    # materialized snapshot of the latest value per key; null-value
    # records are tombstones; null/non-UTF-8 keys are hard errors at
    # encode. On restart the latest snapshot bootstraps the in-memory
    # view; older snapshots may be GC'd out of band.
    # Requires `format: parquet` and `keys.type` ∈ {utf8, json}
    # (defaults to utf8).
    compaction: log
    flush:
      max-time-ms: 60000
      max-bytes: 67108864
      max-offsets: 10000
